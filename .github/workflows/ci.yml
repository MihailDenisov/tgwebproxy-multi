name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt admin server
        run: test -z "$(gofmt -l internal/admin/admin.go)"
      - name: gofmt admin state
        run: test -z "$(gofmt -l internal/admin/state.go)"
      - name: gofmt admin tests
        run: test -z "$(gofmt -l internal/admin/admin_test.go)"
      - name: gofmt config
        run: test -z "$(gofmt -l internal/config/config.go)"
      - name: gofmt main
        run: test -z "$(gofmt -l cmd/tgwebproxy/main.go)"
      - name: gofmt rest
        run: test -z "$(gofmt -l . | grep -v -E '^(internal/admin/admin.go|internal/admin/state.go|internal/admin/admin_test.go|internal/config/config.go|cmd/tgwebproxy/main.go)$')"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
